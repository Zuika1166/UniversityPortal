<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#304f76">
    <title>University Portal</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
</head>
<body>
<div class="shell">
    <header class="sidebar" id="sidebar">
        <div class="brand">
            <strong>University Portal</strong>
        </div>
        <nav class="nav" aria-label="Разделы сайта">
            <button type="button" class="nav-link active" data-nav="home">Главная</button>
            <button type="button" class="nav-link" data-nav="students">Студенты</button>
            <button type="button" class="nav-link" data-nav="teachers">Преподаватели</button>
            <button type="button" class="nav-link" data-nav="courses">Курсы</button>
        </nav>
    </header>
    <div class="workspace">
        <div class="topbar">
            <div class="breadcrumb">Раздел: <strong id="breadcrumb">Главная</strong></div>
        </div>
        <main class="content" id="content" tabindex="-1">
            <div class="loading-card">Загрузка данных</div>
        </main>
        <footer class="footer">
            <span>University Portal</span>
        </footer>
    </div>
</div>
<dialog id="detailDialog" class="dialog"><div id="detailContent"></div></dialog>
<dialog id="editorDialog" class="dialog"><div id="editorContent"></div></dialog>
<dialog id="confirmDialog" class="dialog"><div id="confirmContent"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
